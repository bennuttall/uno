[project]
name = "uno"
version = "0.1.0"
description = "A Python-based Uno game."
authors = [
    {name = "Ben Nuttall", email = "ben@bennuttall.com"}
]
requires-python = ">=3.10"
dependencies = []
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
]
readme = "README.md"

[project.urls]
Source = "https://github.com/bennuttall/uno"
Issues = "https://github.com/bennuttall/uno/issues"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"

[project.scripts]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
lines_after_imports = 2

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"